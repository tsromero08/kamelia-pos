worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # Logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # ── HTTP redirige a HTTPS ──
    server {
        listen 80;
        server_name _;
        # Health check sin HTTPS (para router/monitor LAN)
        location /health { proxy_pass http://backend; access_log off; }
        location / { return 301 https://$host$request_uri; }
    }

    # ── HTTPS principal (cert mkcert local) ──
    server {
        listen 443 ssl http2;
        server_name kamelia.local rancholakamelia.local _;

        ssl_certificate     /etc/nginx/certs/kamelia.local.pem;
        ssl_certificate_key /etc/nginx/certs/kamelia.local-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Service Worker scope (sin cache para evitar SW viejos)
        location = /sw.js {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Service-Worker-Allowed "/";
        }
        location = /manifest.json {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache";
        }

        # SPA estáticos
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "public, max-age=300";
        }

        # Assets con cache largo
        location ~* \.(js|css|png|jpg|jpeg|gif|webp|woff2|ico)$ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # API
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            # Reintentos cortos en LAN
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }

        # WebSocket (cocina, estaciones, despacho)
        location /ws/ {
            proxy_pass             http://backend;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade $http_upgrade;
            proxy_set_header       Connection "upgrade";
            proxy_set_header       Host $host;
            proxy_read_timeout     3600s;
            proxy_send_timeout     3600s;
        }

        # Healthcheck
        location /health      { proxy_pass http://backend; access_log off; }
        location /health/deep { proxy_pass http://backend; access_log off; }

        # Headers de seguridad
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
