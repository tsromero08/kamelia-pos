version: "3.9"

# ════════════════════════════════════════════════════════
#  SISTEMA POS RESTAURANTE — PRODUCCIÓN
#  Un solo puerto: http://localhost  (puerto 80)
#
#  Nombres de contenedor usan COMPOSE_PROJECT_NAME (lo setea
#  personalizar.py al ejecutarse). Así cada cliente tiene scope propio.
# ════════════════════════════════════════════════════════

services:

  # ── Base de datos ─────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-restaurant}_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-restaurant_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CambiaEstaClave123}
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_pos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-restaurant_user}"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ── Backend API ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ${COMPOSE_PROJECT_NAME:-restaurant}_backend
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-restaurant_user}:${POSTGRES_PASSWORD:-CambiaEstaClave123}@db:5432/${POSTGRES_DB:-restaurant_pos}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../restaurant.config.json:/restaurant.config.json:ro

  # ── Frontend + Nginx (todo en uno) ───────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: ${COMPOSE_PROJECT_NAME:-restaurant}_frontend
    restart: always
    ports:
      - "80:80"       # Acceso principal: http://localhost
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
